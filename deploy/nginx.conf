server {
    listen 80;
    server_name sms.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/private-sms-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://sms.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name sms.example.com;
    ssl_certificate /etc/letsencrypt/live/sms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PrivateSMS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 20s;
    access_log /var/log/nginx/private-sms.access.log combined;
    error_log /var/log/nginx/private-sms.error.log warn;
    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
