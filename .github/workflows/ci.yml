name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/tests/share-crypto.mjs
      - run: ./scripts/build-linux.sh
  cloudflare:
    name: Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p bin
          swiftc ios/PrivateSMS/Models.swift ios/Tests/ReadStateTests/main.swift -o bin/read-state-tests
          ./bin/read-state-tests
      - run: >-
          xcodebuild -project ios/PrivateSMS.xcodeproj -scheme PrivateSMS
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/private-sms-ios" CODE_SIGNING_ALLOWED=NO build
